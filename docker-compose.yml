services:
  database:
    container_name: url-shorter-database
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-url}
      POSTGRES_USER: ${DATABASE_USER:-user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-user} -d ${DATABASE_NAME:-url}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url

  redis:
    container_name: url-shorter-redis
    image: redis:8.8.0-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - url

volumes:
  postgres_data:
  redis_data:

networks:
  url:
    driver: bridge
